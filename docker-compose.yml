# ========================================
# docker-compose.prod.yml - Production Back4App
# ========================================
# Les variables sensibles sont injectées par Back4App
# Ne jamais committer ce fichier avec des secrets
# ========================================

version: '3.8'

services:
  # Application NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production  # Stage production du Dockerfile
    container_name: cleaner-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Injectées par Back4App :
      # DATABASE_URL
      # REDIS_URL
      # JWT_SECRET
      # ... autres secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: node dist/main.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cleaner-postgres
    environment:
      # Injectées par Back4App :
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Redis pour le cache et sessions
  redis:
    image: redis:7-alpine
    container_name: cleaner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge