# ========================================
# docker-compose.yml - Développement local
# ========================================
# Pour le développement local avant déploiement Back4App
# ========================================

version: '3.8'

services:
  # Application NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Utilise le stage de build pour le dev
    container_name: cleaner-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: npm run start:dev

  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cleaner-postgres
    environment:
      POSTGRES_DB: cleaner_db
      POSTGRES_USER: cleaner_user
      POSTGRES_PASSWORD: cleaner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  # Redis pour le cache et sessions
  redis:
    image: redis:7-alpine
    container_name: cleaner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx pour le reverse proxy (optionnel)
  nginx:
    image: nginx:alpine
    container_name: cleaner-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
